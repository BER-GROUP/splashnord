<style>
:root{
  --blue:#026FFC;
  --blue-glow: rgba(2,111,252,0.3);
  --whatsapp:#25D366;
  --grey:#3a3a3a;
  --border: rgba(255,255,255,0.09);
  --white:#ffffff;
  --dim: rgba(255,255,255,0.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Outfit',sans-serif;
  background:var(--grey);
  color:var(--white);
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  position:relative;
  overflow-x:hidden;
}

/* ── DECOR : anneaux concentriques, clin d'oeil au hero du site ── */
.rings{
  position:absolute;top:-120px;left:50%;transform:translateX(-50%);
  width:520px;height:520px;pointer-events:none;z-index:0;
}
.rings div{
  position:absolute;top:50%;left:50%;border-radius:50%;
  border:1px solid rgba(2,111,252,0.16);
  transform:translate(-50%,-50%);
}
.rings .r1{width:520px;height:520px;}
.rings .r2{width:360px;height:360px;border-color:rgba(2,111,252,0.22);}
.rings .r3{width:200px;height:200px;border-style:dashed;border-color:rgba(2,111,252,0.3);}

.card{
  position:relative;z-index:1;
  width:100%;max-width:400px;
  display:flex;flex-direction:column;align-items:center;
  gap:28px;
}

.brand{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
.brand img{height:52px;width:auto;filter:drop-shadow(0 0 24px rgba(2,111,252,0.35));}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.01em;}
.brand p{font-size:13px;color:var(--dim);letter-spacing:.02em;}

.actions{width:100%;display:flex;flex-direction:column;gap:12px;}

.btn-devis{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px 20px;border-radius:14px;
  background:var(--blue);color:var(--white);
  text-decoration:none;font-size:16px;font-weight:700;letter-spacing:-.01em;
  box-shadow:0 10px 30px var(--blue-glow);
  border:1px solid rgba(255,255,255,0.12);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-devis:active{transform:scale(0.97);}
.btn-devis svg{width:18px;height:18px;flex-shrink:0;}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:18px 8px;border-radius:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  text-decoration:none;color:var(--white);
  transition:transform .15s ease, background .15s ease;
}
.tile:active{transform:scale(0.95);background:rgba(255,255,255,0.07);}
.tile .icon-wrap{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.tile span{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:.01em;}

.icon-whatsapp{background:rgba(37,211,102,0.14);}
.icon-call{background:rgba(255,255,255,0.08);}
.icon-insta{background:rgba(220,39,67,0.14);}

.footer-link{
  margin-top:4px;font-size:12.5px;color:var(--dim);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:1px;
}
.footer-link:active{color:var(--white);}

@media (min-width:400px){
  .brand img{height:60px;}
}
</style>
</head>

<div class="rings"><div class="r1"></div><div class="r2"></div><div class="r3"></div></div>
